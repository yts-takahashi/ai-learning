<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#CC785C"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#E8967A" stroke-width="6" opacity="0.5"/>

  <!-- Claude-style abstract mark: stylized rays emanating from center -->
  <!-- Inspired by Claude's "starburst" / radial identity mark -->

  <!-- Center circle -->
  <circle cx="256" cy="256" r="42" fill="#FDF6EE"/>

  <!-- Radial strokes (8 directions, alternating long/short) -->
  <!-- Top -->
  <rect x="248" y="88" width="16" height="80" rx="8" fill="#FDF6EE"/>
  <!-- Top-right -->
  <rect x="248" y="88" width="16" height="56" rx="8" fill="#FDF6EE" transform="rotate(45 256 256)"/>
  <!-- Right -->
  <rect x="248" y="88" width="16" height="80" rx="8" fill="#FDF6EE" transform="rotate(90 256 256)"/>
  <!-- Bottom-right -->
  <rect x="248" y="88" width="16" height="56" rx="8" fill="#FDF6EE" transform="rotate(135 256 256)"/>
  <!-- Bottom -->
  <rect x="248" y="88" width="16" height="80" rx="8" fill="#FDF6EE" transform="rotate(180 256 256)"/>
  <!-- Bottom-left -->
  <rect x="248" y="88" width="16" height="56" rx="8" fill="#FDF6EE" transform="rotate(225 256 256)"/>
  <!-- Left -->
  <rect x="248" y="88" width="16" height="80" rx="8" fill="#FDF6EE" transform="rotate(270 256 256)"/>
  <!-- Top-left -->
  <rect x="248" y="88" width="16" height="56" rx="8" fill="#FDF6EE" transform="rotate(315 256 256)"/>
</svg>
